<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="One smart contract for one simulated flood relief campaign: donate test ETH, allocate it after the deadline, and let each recipient withdraw its share." />
    <meta name="color-scheme" content="light dark" />
    <title>Disaster Relief Fund</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='5' fill='%230F2A3D'/%3E%3Cpath d='M5 21c3.2 0 3.2-2.6 6.4-2.6s3.2 2.6 6.4 2.6 3.2-2.6 6.4-2.6c1.4 0 2.2.5 2.8 1' fill='none' stroke='%23fff' stroke-width='2.4' stroke-linecap='round'/%3E%3Cpath d='M16 6v9M12.3 11.3 16 15l3.7-3.7' fill='none' stroke='%23fff' stroke-width='2.4' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E" />
    <script>
      try { var t = localStorage.getItem("relief-fund:theme"); if (t === "light" || t === "dark") document.documentElement.setAttribute("data-theme", t); } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root">
      <p style="font: 16px/1.5 system-ui, sans-serif; max-width: 34rem; margin: 3rem auto; padding: 0 16px; color: #4c6273">
        Starting the Disaster Relief Fund. If this text stays, the app could not start here: open
        Disaster-Relief-Fund.html, or run npm start in the project folder (see README.md). It needs a browser
        from 2021 or later (Chrome or Edge 93, Firefox 92, Safari 15.4).
      </p>
    </div>
    <noscript>This app needs JavaScript: it runs a small Ethereum chain inside the page.</noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
